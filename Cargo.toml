[package]
name = "ghidra-hopper-rs"
version = "0.2.0"
edition = "2021"
description = "Rust-native Reverse Engineering Engine combining Ghidra P-Code/Decompiler with Hopper Disassembler's Byte-State Machine, ObjC/Swift Recovery, 4-Mode CFG, and MCP Server"

[[bin]]
name = "ghidra-hopper-rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false
